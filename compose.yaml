services:
  inventory:
    build: .
    volumes:
      - ./config:/config:ro
      - ./data:/data
    environment:
      RCLONE_CONFIG: /config/rclone.conf
      ACCOUNTS_FILE: /config/accounts.json
      DATABASE_PATH: /data/inventory.sqlite3
      REPORTS_DIR: /data/reports
    restart: "no"
  rclone-config:
    build: .
    entrypoint: ["rclone"]
    profiles: ["setup"]
    volumes:
      - ./config:/config
    environment:
      RCLONE_CONFIG: /config/rclone.conf
